[project]
name = "generate-images"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
]

[project.optional-dependencies]
image-generation = [
    "datasets>=2.14.0",
    "image-generator[huggingface] @ git+https://github.com/paulovsantanas/image-generator.git",
    "pillow>=10.0.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.64.0",
    "torch",
    "vllm==0.26.0",
    "vllm-omni==0.26.0",
]
prompt-enhancing = [
    "accelerate",
    "torch",
    "torchvision",
    "transformers>=4.56.0,<5",
    "huggingface-hub",
    "qwen-vl-utils",
    "datasets>=2.14.0",
    "google-genai>=0.3.0",
    "requests>=2.28.0",
    "tiktoken",
    "tqdm>=4.64.0",
]

transformers5 = [
    "transformers>=5,<6",
]

[tool.uv]
conflicts = [
    [
        { extra = "image-generation" },
        { extra = "prompt-enhancing" },
    ],
    [
        { extra = "transformers5" },
        { extra = "prompt-enhancing" },
    ],
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"
